# fly.io deployment. `fly launch --no-deploy` once to claim the app name, then
# `fly deploy`. Nothing here holds secrets.
app = "dofusjs"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TURN_SECONDS = "45"
  # Pin this to the deployed origin once the hostname is known:
  #   fly secrets set ALLOWED_ORIGINS=https://dofusjs.fly.dev
  ALLOWED_ORIGINS = "*"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
