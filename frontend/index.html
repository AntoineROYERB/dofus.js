<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the board runs under the notch in landscape, and
         the layout pads itself back with the safe-area insets. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2f2f0" />
    <title>Dofus.js</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three roles, three faces: Archivo for names and figures, Public Sans for
      running text, Azeret Mono for the labels and anything that has to line up
      in a column.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Azeret+Mono:wght@400..600&family=Public+Sans:wght@200..800&display=swap"
    />
  </head>
  <body class="bg-paper font-sans text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
